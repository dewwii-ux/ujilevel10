<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login & Register</title>
  </head>

  <body class="bg-slate-100 flex items-center justify-center min-h-screen">
    <div
      class="bg-white w-[900px] rounded-3xl shadow-2xl overflow-hidden grid grid-cols-2"
    >
      <!-- LEFT -->
      <div
        class="bg-[#95bbf0] text-white flex flex-col justify-center items-center p-12"
      >
        <h1 class="text-5xl font-bold mb-4">LUXEA</h1>

        <p class="text-center text-lg opacity-90">
          Fashion • Accessories • Jewelry
        </p>

        <img src="/asset/login.png" class="w-72 mt-10 rounded-2xl shadow-lg" />
      </div>

      <!-- RIGHT -->
      <div class="p-12">
        

        <!-- LOGIN -->
        <form id="loginForm" class="space-y-5">
          <div>
            <label class="text-gray-600">Email</label> 
            <input 
              type="email" id="loginEmail" 
              placeholder="Enter your email" 
              class="w-full border mt-2 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[#748DAE]"/>
          </div>

          <div>
            <label class="text-gray-600">Password</label>

            <input
              type="password"
              id="loginPassword"
              placeholder="Enter your password"
              class="w-full border mt-2 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[#748DAE]"
            />
          </div>

          <button
            type="button"
            id="loginSubmit"
            class="w-full bg-[#213C51] hover:bg-[#748DAE] text-white py-3 rounded-xl font-semibold"
          >
            Login
          </button>

          <p class="text-center text-gray-600 mt-4">
  Belum punya akun?
  <span
    id="goRegister"
    class="text-[#748DAE] font-semibold cursor-pointer hover:underline"
  >
    Register
  </span>
</p>
        </form>

        <!-- REGISTER -->
        <form id="registerForm" class="space-y-5 hidden">
          <div>
            <label class="text-gray-600">Username</label>

            <input
              type="text"
              id="registerUsername"
              placeholder="Enter username"
              class="w-full border mt-2 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[#748DAE]"
            />
          </div>

          <div>
            <label class="text-gray-600">Email</label>

            <input
              type="email"
              id="registerEmail"
              placeholder="Enter email"
              class="w-full border mt-2 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[#748DAE]"
            />
          </div>

          <div>
            <label class="text-gray-600">Password</label>

            <input
              type="password"
              id="registerPassword"
              placeholder="Create password"
              class="w-full border mt-2 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[#748DAE]"
            />
          </div>

          <div>
            <label class="text-gray-600">Confirm Password</label>

            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm password"
              class="w-full border mt-2 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[#748DAE]"
            />
          </div>

          <button
            type="button"
            id="registerSubmit"
            class="w-full bg-[#213C51] hover:bg-[#748DAE] text-white py-3 rounded-xl font-semibold"
          >
            Register
          </button>

          <p class="text-center text-gray-600 mt-4">
  Sudah punya akun?
  <span
    id="goLogin"
    class="text-[#748DAE] font-semibold cursor-pointer hover:underline"
  >
    Login
  </span>
</p>
        </form>
      </div>
    </div>

    <script src="../script/login.js"></script>
  </body>
</html>
