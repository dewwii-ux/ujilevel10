<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cart</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>

    <link href="../src/output.css" rel="stylesheet" />
  </head>

  <body class="bg-neutral-primary">
    <!-- NAVBAR -->
    <nav
      class="bg-neutral-primary fixed top-0 w-full z-50 border-b border-neutral-primary shadow-sm"
    >
      <div
        class="max-w-7xl mx-auto flex items-center justify-between px-6 py-4"
      >
        <!-- LOGO -->
        <a href="../index.html" class="flex items-center gap-3">
          <img
            src="../asset/luxea.jpg"
            class="w-11 h-11 rounded-full object-cover"
            alt=""
          />

          <h1 class="text-2xl font-bold text-heading">Luxea</h1>
        </a>

        <!-- MENU -->
        <div
          class="hidden md:flex items-center gap-8 font-medium text-heading"
        >
          <a
            href="../index.html"
            class="hover:text-[#748DAE] transition"
          >
            Home
          </a>

          <a
            href="../index.html#contact"
            class="hover:text-[#748DAE] transition"
          >
            Contact
          </a>
        </div>

        <!-- RIGHT -->
        <div class="flex items-center gap-4">
          <!-- SEARCH -->
          <form class="hidden md:block">
            <div class="relative">
              <input
                type="search"
                placeholder="Search..."
                class="w-64 rounded-full border border-[#748DAE] bg-white px-4 py-2 pl-10 text-sm outline-none focus:border-[#748DAE]"
              />

              <svg
                class="absolute left-3 top-2.5 w-4 h-4 text-[#748DAE]"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M21 21l-4.35-4.35m1.85-5.65a7.5 7.5 0 11-15 0 7.5 7.5 0 0115 0z"
                />
              </svg>
            </div>
          </form>

          <!-- CART -->
          <a href="cart.html" class="relative">
            <i
              data-feather="shopping-cart"
              class="w-7 h-7 text-[#748DAE]"
            ></i>

            <span
              id="cartCount"
              class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center"
            >
              0
            </span>
          </a>

          <!-- PROFILE -->
          <a
            href="profile.html"
            class="hover:scale-110 transition"
          >
            <i
              data-feather="user"
              class="w-6 h-6 text-[#748DAE]"
            ></i>
          </a>
        </div>
      </div>
    </nav>

    <!-- PRODUCT -->
    <section class="pt-32 px-5">
      <div class="max-w-7xl mx-auto">
        <h2 class="text-3xl font-bold text-heading">Cart</h2>

        <!-- GRID -->
        <div
          id="productContainer"
          class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-7"
        ></div>
      </div>
    </section>

    <!-- CART -->
    <section class="pt-15 pb-20 px-5">
      <div class="max-w-7xl mx-auto grid lg:grid-cols-3 gap-10">

        <!-- CART ITEM -->
        <div
          id="cartContainer"
          class="lg:col-span-2 space-y-5"
        ></div>

        <!-- SUMMARY -->
        <div class="bg-white rounded-2xl shadow p-6 h-fit">
          <h2 class="text-2xl font-bold text-heading mb-5">
            Shopping Summary
          </h2>

          <div class="flex justify-between text-lg">
            <span>Subtotal</span>

            <span id="subtotal">Rp0</span>
          </div>

          <button
            onclick="deleteSelected()"
            class="w-full border border-[#748DAE] text-heading py-3 rounded-xl mt-4"
          >
            Delete Selected
          </button>

          <button
            onclick="checkoutSelected()"
            class="bg-[#213C51] text-white w-full py-3 rounded-xl mt-6"
          >
            Checkout
          </button>
        </div>
      </div>
    </section>

    <!-- SCRIPT -->
    <script src="../script/cart.js"></script>

    <script>
      feather.replace();
    </script>
  </body>
</html>
