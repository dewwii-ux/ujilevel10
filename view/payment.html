<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Payment</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-neutral-primary">

  <!-- PAYMENT -->
  <section class="py-16 px-5">

    <div class="max-w-6xl mx-auto grid lg:grid-cols-3 gap-10">

      <!-- PRODUCT -->
      <div class="lg:col-span-2">

        <div class="flex items-center gap-4 mb-8">

          <a
            href="cart.html"
            class="text-[#213C51] hover:text-[#748DAE] transition"
          >
            ← Back to Cart
          </a>

          <h2 class="text-3xl font-bold text-heading">
            Payment
          </h2>

        </div>

        <div
          id="paymentItems"
          class="space-y-5"
        ></div>

      </div>

      <!-- SUMMARY -->
      <div class="bg-white p-6 rounded-2xl shadow h-fit">

        <h2 class="text-2xl font-bold text-heading mb-6">
          Payment Detail
        </h2>

        <!-- SUBTOTAL -->
        <div class="flex justify-between mb-4">

          <span>
            Subtotal
          </span>

          <span id="subtotal">
            Rp 0
          </span>

        </div>

        <!-- SHIPPING -->
        <div class="flex justify-between mb-4">

          <span>
            Shipping
          </span>

          <span>
            Rp 20.000
          </span>

        </div>

        <!-- TOTAL -->
        <div
          class="flex justify-between text-xl font-bold border-t pt-4"
        >

          <span>
            Total
          </span>

          <span id="total">
            Rp 0
          </span>

        </div>

        <!-- PAYMENT METHOD -->
        <div class="mt-8">

          <label class="font-semibold text-gray-700">
            Payment Method
          </label>

          <select
            id="paymentMethod"
            class="w-full mt-3 border rounded-xl px-4 py-3 outline-none focus:border-neutral-primary"
          >

            <option value="BCA">
              Bank BCA
            </option>

            <option value="Mandiri">
              Bank Mandiri
            </option>

            <option value="DANA">
              DANA
            </option>

            <option value="GoPay">
              GoPay
            </option>

          </select>

        </div>

        <!-- BUTTON -->
        <button
          onclick="payNow()"
          class="bg-[#213C51] hover:bg-[#748DAE] transition text-white w-full py-3 rounded-xl mt-8"
        >
          Pay Now
        </button>

      </div>

    </div>

  </section>

  <!-- PAYMENT SCRIPT -->
  <script src="../script/payment.js"></script>

</body>
</html>
